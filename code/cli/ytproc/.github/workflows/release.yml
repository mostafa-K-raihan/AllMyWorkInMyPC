name: YTProc Release

on:
  push:
    tags:
      - 'ytproc/v*'
    paths:
      - 'code/cli/ytproc/**'
      - '.github/workflows/ytproc-release.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/cli/ytproc
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
      - name: Run tests
        run: go test -v ./...

  build:
    needs: test
    name: Build and Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/cli/ytproc
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Build Release Binaries
        run: |
          chmod +x build.sh
          ./build.sh --release
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: "YTProc ${{ github.ref_name }}"
          files: |
            code/cli/ytproc/dist/ytproc-linux-amd64
            code/cli/ytproc/dist/ytproc-linux-arm64
            code/cli/ytproc/dist/ytproc-darwin-amd64
            code/cli/ytproc/dist/ytproc-darwin-arm64
            code/cli/ytproc/dist/ytproc-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          body: |
            ## YTProc Release ${{ github.ref_name }}
            
            YouTube Video Processor with interactive CLI
            
            ### Installation
            Download the appropriate binary for your platform and follow the installation instructions in the [README](code/cli/ytproc/README.md).
            
            ### Changes
            See release notes below for changes in this version. 
