repos:
-   repo: local
    hooks:
      - id: delegate-precommit
        name: Delegate Pre-commit Tasks
        entry: |
          echo "Delegating pre-commit tasks to submodules"
          cd code/cli/ytproc && go run precommit.go
        language: system
        types: [go]  # Ensure this runs only for Go files

# Remove any Python-specific hooks
# If you had any Python-specific hooks, they should be deleted from here.
