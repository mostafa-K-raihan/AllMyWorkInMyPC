name: Main CI/CD

on:
  pull_request:
    branches: [ master ]

jobs:
  # Generic checks that apply to all files
  generic-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit hooks
      run: |
        pre-commit install
        pre-commit run --all-files

    - name: Check for broken links
      run: |
        # Add your main project checks here
        echo "Main project checks completed"

  # Language-specific checks for submodules
  check-submodules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    # Go project checks (ytproc)
    - name: Setup Go for ytproc
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        check-latest: true
        submodules: true

    - name: Run ytproc Go checks
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      run: |
        cd code/cli/ytproc
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        go build -v ./...

    - name: Upload ytproc coverage
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      uses: codecov/codecov-action@v3
      with:
        file: ./code/cli/ytproc/coverage.txt
        fail_ci_if_error: true

    # Python project checks (cli-qf)
    - name: Setup Python for cli-qf
      if: contains(github.event.pull_request.changed_files, 'code/cli/cli-qf/')
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Run cli-qf Python checks
      if: contains(github.event.pull_request.changed_files, 'code/cli/cli-qf/')
      run: |
        cd code/cli/cli-qf
        pip install -r requirements.txt
        pytest --cov=cli_qf tests/

    # Add more language-specific checks here as needed
    # Example:
