name: Main CI/CD

on:
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit hooks
      run: |
        pre-commit install
        pre-commit run --all-files

  check-submodules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    # Check ytproc submodule
    - name: Check ytproc
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        check-latest: true
        submodules: true

    - name: Test ytproc
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      run: |
        cd code/cli/ytproc
        go test -v ./...
        go build -v ./...

    - name: Run ytproc tests
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      run: |
        cd code/cli/ytproc
        go test -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage
      if: contains(github.event.pull_request.changed_files, 'code/cli/ytproc/')
      uses: codecov/codecov-action@v3
      with:
        file: ./code/cli/ytproc/coverage.txt
        fail_ci_if_error: true

  # Add more submodule checks here as needed
  # Example:
  # check-cli-qf:
  #   if: contains(github.event.pull_request.changed_files, 'code/cli/cli-qf/')
  #   ...

  # Add any main project specific checks here
  check-main-project:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Check for broken links
      run: |
        # Add your main project checks here
        echo "Main project checks completed"
