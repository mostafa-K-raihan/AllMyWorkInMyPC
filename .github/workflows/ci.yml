name: Go CI

on:
  push:
    branches:
      - main  # Change to your default branch
  pull_request:
    branches:
      - main  # Change to your default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.18'  # Specify your Go version

      - name: Run Go tests
        run: |
          cd code/cli/ytproc
          go test ./...  # Run tests in the Go submodule

      - name: Run Go build
        run: |
          cd code/cli/ytproc
          go build  # Build the Go application 
