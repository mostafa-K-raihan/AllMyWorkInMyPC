name: Go CI
on:
  push:
    paths:
      - 'code/cli/ytproc/**'
    branches:
      - master
  pull_request:
    paths:
      - 'code/cli/ytproc/**'
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21'  # Using a more recent Go version

      - name: Install dependencies
        run: |
          cd code/cli/ytproc
          go mod download

      - name: Run Go tests
        run: |
          cd code/cli/ytproc
          go test -v ./...

      - name: Build Go application
        run: |
          cd code/cli/ytproc
          go build -v

      # Optional: Add linting
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: code/cli/ytproc
